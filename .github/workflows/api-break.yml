---
name: api-break

# The `api-break` label on a pull request that breaks the public API:
# btclib-org/.github's `reusable-api-break.yml` walks the package with griffe
# against the pull request's base commit (btclib-org/.github#1674). It is
# advisory and gates nothing: before 1.0 a package breaks its surface
# deliberately, and the label is for the reviewer to weigh. `release.yml`'s
# `public-api` job asks the same question of a release.
#
# The trigger, its types and the concurrency group are here, as section 10
# of the organization's standard has them, with the job's `permissions:`
# and the `package` input. The job, the script and the label's logic are the
# callee's, called at `@main` so a fix there reaches this tree in one
# landing. No `pull_request_target`: section 12 of the organization's
# standard says why a fork's pull request is not labelled
# (`OSPS-BR-01.01`).

on:
  pull_request:
    # closed so that the run for a pull request that has stopped taking
    # changes enters the group below: a close cancels the run in flight,
    # a merge queues behind it. The callee's `if:` declines the closed run
    # itself
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:

# least privilege for the GITHUB_TOKEN at the workflow level, elevated on
# the calling job below
permissions:
  contents: read

# named literally rather than through github.workflow, as everywhere else
# here. A push supersedes the run it overtakes. There is no push trigger,
# so the walk in flight is the only reading a merged pull request gets
concurrency:
  group: api-break-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event.action == 'closed' && github.event.pull_request.merged) }}

jobs:
  api-break:
    # a caller's permissions: block bounds the called workflow and refuses
    # rather than trims, so the scope the callee's job asks for is named
    # here
    permissions:
      contents: read
      pull-requests: write # the label; read-only on a fork
    uses: btclib-org/.github/.github/workflows/reusable-api-break.yml@main
    with:
      package: base58_bech32
